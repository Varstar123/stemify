<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stemify — Karaoke Maker</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0B0B'/%3E%3Crect x='4' y='13' width='3.6' height='10' rx='1.4' fill='%23EE3A2F'/%3E%3Crect x='10.2' y='9' width='3.6' height='14' rx='1.4' fill='%23EE3A2F'/%3E%3Crect x='16.4' y='4.5' width='3.6' height='18.5' rx='1.4' fill='%23EE3A2F'/%3E%3Crect x='22.6' y='11' width='3.6' height='12' rx='1.4' fill='%23EE3A2F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fafaf9;
    --surface: #ffffff;
    --ink: #111111;
    --grey: #767676;
    --grey-light: #a3a3a3;
    --line: #e4e2df;
    --red: #e8302a;
    --red-dark: #c21f1a;
    --red-wash: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Space Grotesk", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 20px 72px;
  }

  header { text-align: center; margin-bottom: 30px; }
  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 14px;
  }
  .wordmark svg { display: block; flex-shrink: 0; }
  .wordmark span {
    font-size: clamp(2.2rem, 6vw, 3rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--ink);
  }
  header p {
    color: var(--grey);
    margin: 0 auto;
    font-size: 1.02rem;
    font-weight: 500;
    max-width: 34ch;
  }

  .rule {
    width: 100%;
    max-width: 560px;
    height: 1px;
    background: var(--line);
    margin: 0 0 32px;
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: var(--surface);
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    padding: 30px;
  }

  #dropzone {
    border: 1.5px dashed var(--line);
    border-radius: 4px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #dropzone.drag { border-color: var(--red); background: var(--red-wash); }
  #dropzone svg { margin-bottom: 12px; }
  #dropzone div:not(.hint) { font-size: 1rem; font-weight: 500; }
  #dropzone .hint { color: var(--grey); font-size: 0.85rem; margin-top: 8px; font-weight: 500; }
  #fileInput { display: none; }

  #fileInfo {
    display: none;
    margin-top: 16px;
    padding: 13px 16px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 0.92rem;
    justify-content: space-between;
    align-items: center;
  }
  #fileInfo span.name { color: var(--ink); font-weight: 600; }
  #fileInfo span.size { color: var(--grey); font-weight: 500; }

  button#submitBtn {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 4px;
    background: var(--red);
    color: #ffffff;
    font-family: inherit;
    font-size: 1.02rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: background .15s;
  }
  button#submitBtn:disabled { opacity: 0.35; cursor: not-allowed; }
  button#submitBtn:not(:disabled):hover { background: var(--red-dark); }

  #status {
    margin-top: 22px;
    display: none;
  }
  #status .row { display: flex; align-items: center; gap: 10px; color: var(--grey); font-weight: 500; font-size: 0.92rem; margin-bottom: 14px; }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--line);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #progressTrack {
    width: 100%;
    height: 8px;
    border-radius: 999px;
    background: var(--paper);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: var(--red);
    transition: width 0.4s ease;
  }
  #progressPct {
    margin-top: 8px;
    text-align: right;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  #result {
    display: none;
    margin-top: 22px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
  }
  #result h3 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 14px;
    color: var(--ink);
    font-size: 1.05rem;
    font-weight: 700;
  }
  #result h3 svg { flex-shrink: 0; }
  audio { width: 100%; margin-bottom: 14px; }
  a#downloadLink {
    display: block;
    text-align: center;
    padding: 13px;
    border-radius: 4px;
    background: var(--red);
    color: #ffffff;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-decoration: none;
    transition: background .15s;
  }
  a#downloadLink:hover { background: var(--red-dark); }

  #errorBox {
    display: none;
    margin-top: 18px;
    padding: 13px 15px;
    background: var(--red-wash);
    border-left: 3px solid var(--red);
    color: var(--ink);
    font-weight: 500;
    border-radius: 2px;
    font-size: 0.88rem;
    white-space: pre-wrap;
  }

  footer {
    margin-top: 32px;
    color: var(--grey-light);
    font-size: 0.8rem;
    font-weight: 500;
    text-align: center;
    max-width: 40ch;
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">
    <svg width="34" height="34" viewBox="0 0 32 32" fill="none">
      <rect x="4" y="13" width="3.6" height="10" rx="1.4" fill="#e8302a"/>
      <rect x="10.2" y="9" width="3.6" height="14" rx="1.4" fill="#e8302a"/>
      <rect x="16.4" y="4.5" width="3.6" height="18.5" rx="1.4" fill="#111111"/>
      <rect x="22.6" y="11" width="3.6" height="12" rx="1.4" fill="#e8302a"/>
    </svg>
    <span>Stemify</span>
  </div>
  <p>Upload a song. Get back the instrumental, vocals removed.</p>
</header>

<div class="rule"></div>

<div class="card">
  <div id="dropzone">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.6">
      <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>Drag and drop an audio file, or click to browse</div>
    <div class="hint">MP3, WAV, M4A, FLAC — up to 60MB</div>
  </div>
  <input type="file" id="fileInput" accept=".mp3,.wav,.m4a,.flac,.ogg,.aac,.wma">

  <div id="fileInfo">
    <span class="name" id="fileName"></span>
    <span class="size" id="fileSize"></span>
  </div>

  <button id="submitBtn" disabled>Remove vocals</button>

  <div id="status">
    <div class="row"><div class="spinner"></div><span id="statusText">Processing...</span></div>
    <div id="progressTrack"><div id="progressFill"></div></div>
    <div id="progressPct">0%</div>
  </div>

  <div id="errorBox"></div>

  <div id="result">
    <h3>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e8302a" stroke-width="2.2">
        <circle cx="12" cy="12" r="9.5" stroke-linecap="round"/>
        <path d="M8 12.5l2.6 2.6L16.5 9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Instrumental ready
    </h3>
    <audio id="resultAudio" controls></audio>
    <a id="downloadLink" download>Download MP3</a>
  </div>
</div>

<footer>Runs on Demucs (AI source separation) locally on this server. Larger files take longer to process.</footer>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileInfo = document.getElementById('fileInfo');
const fileNameEl = document.getElementById('fileName');
const fileSizeEl = document.getElementById('fileSize');
const submitBtn = document.getElementById('submitBtn');
const statusBox = document.getElementById('status');
const statusText = document.getElementById('statusText');
const progressFill = document.getElementById('progressFill');
const progressPct = document.getElementById('progressPct');
const errorBox = document.getElementById('errorBox');
const resultBox = document.getElementById('result');
const resultAudio = document.getElementById('resultAudio');
const downloadLink = document.getElementById('downloadLink');

let selectedFile = null;

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) setFile(fileInput.files[0]);
});

function setFile(file) {
  selectedFile = file;
  fileNameEl.textContent = file.name;
  fileSizeEl.textContent = (file.size / (1024*1024)).toFixed(1) + ' MB';
  fileInfo.style.display = 'flex';
  submitBtn.disabled = false;
  resultBox.style.display = 'none';
  errorBox.style.display = 'none';
}

function formatBytes(n) { return (n/(1024*1024)).toFixed(1) + ' MB'; }

submitBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  submitBtn.disabled = true;
  errorBox.style.display = 'none';
  resultBox.style.display = 'none';
  statusBox.style.display = 'block';
  statusText.textContent = 'Uploading...';
  setProgress(0);

  const formData = new FormData();
  formData.append('file', selectedFile);

  try {
    const res = await fetch('/api/jobs', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Upload failed');

    const jobId = data.job_id;
    statusText.textContent = 'Separating vocals (this can take a while)...';
    await pollJob(jobId);
  } catch (err) {
    showError(err.message);
  } finally {
    submitBtn.disabled = false;
  }
});

async function pollJob(jobId) {
  while (true) {
    await new Promise(r => setTimeout(r, 2500));
    const res = await fetch(`/api/jobs/${jobId}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Job lookup failed');

    if (data.status === 'error') {
      throw new Error(data.error || 'Separation failed');
    }
    if (data.status === 'done') {
      setProgress(100);
      statusBox.style.display = 'none';
      const url = `/api/jobs/${jobId}/download`;
      resultAudio.src = url;
      downloadLink.href = url;
      resultBox.style.display = 'block';
      return;
    }
    statusText.textContent = data.progress || 'Processing...';
    setProgress(data.percent || 0);
  }
}

function setProgress(pct) {
  pct = Math.max(0, Math.min(100, pct));
  progressFill.style.width = pct + '%';
  progressPct.textContent = pct + '%';
}

function showError(msg) {
  statusBox.style.display = 'none';
  errorBox.textContent = msg;
  errorBox.style.display = 'block';
}
</script>

</body>
</html>
